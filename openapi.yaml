openapi: 3.0.3
info:
  title: JSONPlaceholder Posts API (minimal contract)
  version: "1.0.0"
servers:
  - url: https://jsonplaceholder.typicode.com
paths:
  /posts:
    get:
      operationId: listPosts
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPost"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}:
    get:
      operationId: getPost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
components:
  schemas:
    NewPost:
      type: object
      required: [title, body, userId]
      properties:
        title: { type: string }
        body: { type: string }
        userId: { type: integer }
    Post:
      type: object
      required: [userId, id, title, body]
      properties:
        userId: { type: integer }
        id: { type: integer }
        title: { type: string }
        body: { type: string }
